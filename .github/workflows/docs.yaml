name: "Publish documentation"

on:
  push:
    branches:
      - "main"

jobs:
  githubpages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install deps and build the extension
        run: uv sync

      - name: Make API docs
        run: uv run invoke apidoc

      - name: Upload artifact to Github Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "apihtml/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
