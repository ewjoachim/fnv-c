name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  release:
    types:
      - created

jobs:
  linux_lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "pypy3.8"]
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event. Selected python version is ${{ matrix.python-version }}."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python --version
      - name: Deps install
        run: |
          pip install -r dev-requirements.txt
      - name: Install develop
        run: |
          python3 setup.py develop
      - name: Run lint
        run: |
          invoke lint --no-fix
      - name: Run tests
        run: |
          invoke test --coverage
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.7' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  macos_test:
    runs-on: macos-13
    strategy:
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "pypy3.8"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r dev-requirements.txt

      - name: Install fnv-c as editable
        run: |
          python3 setup.py develop

      - name: Run tests
        run: |
          invoke test --coverage

  # --- Release: only runs on a published release, and only after the test
  # jobs above succeed, so we never publish something that wasn't tested. ---

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [linux_lint_and_test, macos_test]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # dunamai (invoke bump-version) needs the full history and tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          pip install dunamai==1.17.0 invoke==2.1.1 cibuildwheel==4.1.0

      - name: Bump version
        run: |
          invoke bump-version

      - name: Build wheels
        # Builds manylinux + musllinux wheels and runs auditwheel repair
        # automatically. Covers CPython 3.9-3.14 and PyPy 3.9-3.11.
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    needs: [linux_lint_and_test, macos_test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install dunamai==1.17.0 invoke==2.1.1 build==1.2.1

      - name: Bump version
        run: |
          invoke bump-version

      - name: Build sdist
        run: |
          python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twine
        run: |
          pip install twine==4.0.2

      - name: Upload to PyPi
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          twine upload dist/*
